
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android launcher icons from MOK logo
        run: |
          python3 -m pip install --user cairosvg
          python3 - <<'PY'
          import cairosvg, os
          svg="app/src/main/assets/mok_launcher.svg"
          for folder, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              dest=f"app/src/main/res/mipmap-{folder}"
              os.makedirs(dest,exist_ok=True)
              cairosvg.svg2png(url=svg,write_to=dest+"/ic_launcher.png",output_width=size,output_height=size)
          # Render the exact MOK logo paths without the launcher text or white background.
          import re
          source=open(svg,encoding="utf-8").read()
          logo_path=re.search(r'<path d="([^"]+)"',source).group(1)
          wallpaper=f'<svg xmlns="http://www.w3.org/2000/svg" width="985" height="625" viewBox="0 0 985 625"><path d="{logo_path}" fill="#424242" fill-rule="evenodd"/></svg>'
          dest="app/src/main/res/drawable-nodpi"
          os.makedirs(dest,exist_ok=True)
          cairosvg.svg2png(bytestring=wallpaper.encode("utf-8"),write_to=dest+"/mok_watermark.png",output_width=985,output_height=625)
          PY

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MOK-Zamer-APK
          path: app/build/outputs/apk/debug/*.apk
